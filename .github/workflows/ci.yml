name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LOOM_EMBEDDING_BACKEND: hashing
  LOOM_VECTOR_BACKEND: duckdb
  LOOM_SANDBOX_BACKEND: subprocess

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check src tests scripts
      - name: Ruff format
        run: uv run ruff format --check src tests scripts
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest -m "not integration and not llm" --cov=loom --cov-report=term

  sandbox-image:
    name: Build sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push)
        run: docker build -t loom-sandbox:ci -f sandbox/Dockerfile .

  eval-gate:
    name: Eval regression gate
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Secrets cannot be referenced in a job-level `if`, so expose presence as a step output.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Skip notice
        if: steps.key.outputs.present == 'false'
        run: echo "ANTHROPIC_API_KEY secret not set; eval gate skipped."
      - uses: astral-sh/setup-uv@v3
        if: steps.key.outputs.present == 'true'
        with:
          enable-cache: true
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: uv sync --all-groups
      - name: Restore benchmark data
        if: steps.key.outputs.present == 'true'
        run: |
          uv run python scripts/ingest.py --dataset all --limit 50000
          uv run python scripts/build_semantic.py --dataset all
      - name: Run benchmark sample
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: uv run python scripts/run_benchmark.py --sample 40 --injection all --out outputs/eval/ci
      - name: Fetch baseline from main
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p outputs/eval/baseline
          # On a PR compare against main's committed baseline; on main compare against the committed file itself.
          if git show origin/main:benchmarks/baseline_results.json > outputs/eval/baseline/results.json 2>/dev/null; then
            echo "baseline from origin/main"
          elif [ -f benchmarks/baseline_results.json ]; then
            cp benchmarks/baseline_results.json outputs/eval/baseline/results.json
          else
            echo "no baseline available; gate will pass with a warning"
          fi
      - name: Gate
        if: steps.key.outputs.present == 'true'
        run: uv run python scripts/eval_gate.py outputs/eval/ci/results.json --baseline outputs/eval/baseline/results.json
      - name: Upload report
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            outputs/eval/ci/report.md
            outputs/eval/ci/results.json
