[project]
name = "loom"
version = "0.1.0"
description = "Loom: multi-agent data-to-decision platform (plan, execute, verify, explain)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "requests>=2.32",
    "anthropic>=0.40",
    "boto3>=1.34",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0",
    "llama-index-core>=0.11",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "langfuse>=2.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.44",
    "torch>=2.4",
]

[project.scripts]
loom = "loom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "moto[s3,lambda]>=5.0",
    "vcrpy>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["loom"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs network, Docker, Postgres or model downloads",
    "llm: needs a live LLM provider",
]

[tool.coverage.run]
source = ["src/loom"]
